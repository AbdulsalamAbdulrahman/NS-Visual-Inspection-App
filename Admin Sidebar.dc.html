<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:248px;height:100%;box-sizing:border-box;background:var(--sf);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:4px;font-family:'Public Sans',sans-serif;color:var(--ink)">
  <div style="display:flex;align-items:center;gap:10px;padding:0 8px 20px">
    <div style="width:40px;height:40px;border-radius:11px;background:#fff url(assets/ke-logo.png) 52% 50%/165% no-repeat;box-shadow:0 0 0 1px var(--line);flex:none"></div>
    <div style="display:flex;flex-direction:column"><b style="font-size:15px">Kaduna Electric</b><span style="font-size:12px;color:var(--mut)">Site Inspection · Admin</span></div>
  </div>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
    <div style="height:44px;border-radius:10px;padding:0 12px;display:flex;align-items:center;gap:12px;font-size:15px;background:{{ it.bg }};color:{{ it.fg }};font-weight:{{ it.w }}"><i style="font-size:21px">{{ it.icon }}</i><span style="flex:1">{{ it.label }}</span><span style="font:500 12px 'IBM Plex Mono';color:var(--mut)">{{ it.count }}</span></div>
  </sc-for>
  <div style="margin-top:auto;padding:12px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;gap:10px">
    <span style="width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--brand);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center">HM</span>
    <div style="flex:1;display:flex;flex-direction:column"><b style="font-size:14px">Hadiza Musa</b><span style="font-size:12px;color:var(--mut)">NSD Admin</span></div>
    <i style="font-size:20px;color:var(--mut)">unfold_more</i>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Overview&quot;,&quot;Inspections&quot;,&quot;Contractors&quot;,&quot;Service reps&quot;,&quot;Service areas&quot;,&quot;Payments&quot;,&quot;Fee settings&quot;],&quot;default&quot;:&quot;Overview&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Overview';
    const list = [['Overview', 'space_dashboard', ''], ['Inspections', 'assignment', '412'], ['Contractors', 'engineering', '64'], ['Service reps', 'badge', '18'], ['Service areas', 'map', '13'], ['Payments', 'payments', ''], ['Fee settings', 'tune', '']];
    return { items: list.map(([label, icon, count]) => ({ label, icon, count, bg: label === a ? 'var(--soft)' : 'transparent', fg: label === a ? 'var(--brand)' : 'var(--ink)', w: label === a ? 700 : 500 })) };
  }
}
</script>
</body>
</html>
