name: deploy

# Push to main → run every check → publish a ready-to-run build to the
# `deploy` branch. The server pulls that branch itself (deploy/server-pull.sh,
# run by cron), because the host blocks inbound SSH. See docs/DEPLOY.md.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Dev dependencies are only needed to build (Wayfinder runs artisan);
      # the server installs its own production vendor/ from composer.lock.
      - name: Build assets
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate --ansi
          npm run build
          test -f public/build/manifest.json

      - name: Assemble release
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          rsync -a --delete --exclude-from=deploy/release-exclude.txt ./ "$RUNNER_TEMP/release/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release/REVISION"

      - name: Publish to the deploy branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$RUNNER_TEMP/deploy-branch"

          # Continue the branch's history when it exists, start it otherwise.
          if git ls-remote --exit-code --heads "$remote" deploy >/dev/null; then
            git clone --quiet --depth 1 --branch deploy "$remote" "$work"
          else
            git init --quiet --initial-branch=deploy "$work"
            git -C "$work" remote add origin "$remote"
          fi

          rsync -a --delete --exclude .git "$RUNNER_TEMP/release/" "$work/"

          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all --force
          if git diff --cached --quiet; then
            echo "Nothing changed since the last release."
            exit 0
          fi
          git commit --quiet -m "Release ${GITHUB_SHA::7}" -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push --quiet origin HEAD:deploy
          echo "Published ${GITHUB_SHA::7} to the deploy branch. The server picks it up within a minute." >> "$GITHUB_STEP_SUMMARY"
